[advisories]
yanked = "deny"
# Unmaintained or unsound crates that only the desktop app's Tauri/GTK webview stack pulls in; drop each when Tauri moves off it.
ignore = [
    "RUSTSEC-2024-0370", # proc-macro-error, via gtk3-rs
    "RUSTSEC-2025-0075", # unic-char-range, via tauri-utils
    "RUSTSEC-2025-0080", # unic-common, via tauri-utils
    "RUSTSEC-2025-0081", # unic-char-property, via tauri-utils
    "RUSTSEC-2025-0098", # unic-ucd-version, via tauri-utils
    "RUSTSEC-2025-0100", # unic-ucd-ident, via tauri-utils
    # Folded into zbus 6 and unmaintained alone; keyring's Secret Service store and the Tauri plugins still need zbus 5.
    "RUSTSEC-2026-0370", # zvariant, via zbus 5
    "RUSTSEC-2026-0371", # zbus_names, via zbus 5
    "RUSTSEC-2026-0372", # zvariant_derive, via zbus 5
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# File-level copyleft, pulled in only by the desktop app's webview stack and used unmodified.
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
    { allow = ["MPL-2.0"], crate = "selectors" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
