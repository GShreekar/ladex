[package]
name = "transport-spike"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone so the main workspace and CI never build the spike's dependency tree.
[workspace]

[dependencies]
anyhow = "1"
blake3 = "1.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
# iroh-blobs also turns iroh's defaults off; this drops UPnP portmapping and metrics.
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
iroh-blobs = "0.103"
libc = "0.2"
quinn = "0.11.12"
rand = "0.8"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
debug = 1
