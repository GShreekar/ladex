[package]
name = "ladex-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "LADEX app: a Tauri window around an embedded node, on desktop and Android"

# A library too, because Android loads the app as a shared library.
[lib]
name = "ladex_app_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ladex-core.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
include_dir.workspace = true
anyhow.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The tray, login item, single-window rule and opening folders only exist on desktop.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

# Android drops a process's stdout, so logs go to logcat (`adb logcat -s LADEX`).
[target.'cfg(target_os = "android")'.dependencies]
tracing-logcat = "0.1"
tauri-plugin-ladex-android = { path = "../tauri-plugin-ladex-android" }
tokio.workspace = true

[dev-dependencies]
serde_json.workspace = true
