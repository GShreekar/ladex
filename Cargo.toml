[workspace]
resolver = "2"
members = ["crates/ladex-core", "crates/ladex-cli", "crates/ladex-app"]
# The app needs the platform webview, so plain `cargo build` and `cargo test` leave it out.
default-members = ["crates/ladex-core", "crates/ladex-cli"]

[workspace.package]
version = "3.1.0-alpha.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/GShreekar/ladex"
publish = false

[workspace.dependencies]
warp = { version = "0.4.1", features = ["websocket", "server"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
tokio = { version = "1.47.1", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
socket2 = { version = "0.5", features = ["all"] }
chrono = { version = "0.4", features = ["serde"] }
tracing-subscriber = "0.3"
futures-util = "0.3"
include_dir = "0.7"
mime_guess = "2.0"
rand = "0.8"
clap = { version = "4.0", features = ["derive"] }
ring = "0.17"
hex = "0.4"
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
if-addrs = "0.15"
gethostname = "0.5"
qrcode = { version = "0.14", default-features = false }
mdns-sd = "0.21"
spake2 = "0.4"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"
tokio-tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
subtle = "2"
fs4 = { version = "0.13", features = ["sync"] }
cap-std = "4"
bytes = "1"
http-body-util = "0.1"
percent-encoding = "2"
crc32fast = "1"
blake3 = "1.8"
rayon = "1.10"
tempfile = "3"
proptest = "1"
ed25519-dalek = "2"
keyring = "4"
data-encoding = "2"
redb = "4"
# platform-verifier is off: mesh peers are checked against node keys, never OS certificate roots.
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
ladex-core = { path = "crates/ladex-core" }
