[workspace]
resolver = "2"
members = ["crates/ladex-core", "crates/ladex-cli"]

[workspace.package]
version = "2.1.0"
edition = "2021"

[workspace.dependencies]
warp = { version = "0.4.1", features = ["websocket", "server"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47.1", features = ["full"] }
tokio-tungstenite = "0.20"          # Phase 3: outbound mesh WS connections
anyhow = "1.0"                      # Phase 3: ergonomic errors in mesh.rs
tracing = "0.1"                     # structured logging macros
socket2 = { version = "0.5", features = ["all"] }  # Phase 2: SO_REUSEADDR/SO_REUSEPORT on multicast socket
chrono = { version = "0.4", features = ["serde"] }
tracing-subscriber = "0.3"
futures-util = "0.3"
include_dir = "0.7"
mime_guess = "2.0"
rand = "0.8"
clap = { version = "4.0", features = ["derive"] }
ring = "0.17"                       # HMAC-SHA256 handshake proofs, SHA-256 digests
hex = "0.4"                         # hex-encode handshake messages and the cookie secret
rcgen = "0.13"                      # BUG-03 fix: self-signed TLS cert generation
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] } # BUG-03 fix
if-addrs = "0.15"                   # BUG-03 fix: enumerate local IPv4s for cert SANs
gethostname = "0.5"                 # BUG-14 fix: read hostname without shelling out
qrcode = { version = "0.14", default-features = false } # F1: terminal QR code
mdns-sd = "0.21"                    # F2: advertise ladex.local via mDNS/DNS-SD
spake2 = "0.4"                      # password-authenticated key exchange for the mesh handshake
hyper = { version = "1", features = ["server", "http1"] }  # serve connections ourselves (see server.rs)
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"
subtle = "2"                        # constant-time comparison
fs4 = { version = "0.13", features = ["sync"] }
bytes = "1"
http-body-util = "0.1"
percent-encoding = "2"
crc32fast = "1"
tempfile = "3"
ed25519-dalek = "2"                 # the node's long-lived identity key
keyring = "4"                       # keeps that key in the OS keychain
data-encoding = "2"                 # base32 node ids
ladex-core = { path = "crates/ladex-core" }
