name: Release Ladex CLI and app

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # One tag, one version: the CLI, the app and the web UI all have to carry the tag's version.
  version:
    name: Check the tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ladex-app") | .version')
          UI_VERSION=$(jq -r .version ui/package.json)
          echo "tag $TAG_VERSION, crates $CRATE_VERSION, ui $UI_VERSION"
          if [[ "$CRATE_VERSION" != "$TAG_VERSION" || "$UI_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Set the version in Cargo.toml and ui/package.json to $TAG_VERSION before tagging."
            exit 1
          fi

  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name_suffix: macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_name_suffix: macos-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name_suffix: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_name_suffix: linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name_suffix: windows-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools for ARM64 Linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install zip (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install zip -y

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p ladex --target ${{ matrix.target }}

      - name: Package the binary
        shell: bash
        run: |
          APP_NAME="ladex"
          VERSION_TAG=${{ github.ref_name }}
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            BINARY_NAME="${APP_NAME}.exe"
            ARCHIVE_NAME="${APP_NAME}-${VERSION_TAG}-${{ matrix.archive_name_suffix }}.zip"
            zip -j $ARCHIVE_NAME "./target/${{ matrix.target }}/release/${BINARY_NAME}"
          else
            BINARY_NAME="${APP_NAME}"
            ARCHIVE_NAME="${APP_NAME}-${VERSION_TAG}-${{ matrix.archive_name_suffix }}.tar.gz"
            tar -czf $ARCHIVE_NAME -C "./target/${{ matrix.target }}/release" $BINARY_NAME
          fi
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}

  # Unsigned installers that carry the `ladex` CLI too; macOS builds are ad-hoc signed so they open at all.
  app:
    name: Desktop app for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: version
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            # MSI refuses versions such as 3.0.0-rc.1; NSIS takes them.
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install the webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf file

      - name: Build the web UI the app embeds
        working-directory: ui
        run: |
          npm ci
          npm run build

      # The installer ships the CLI next to the app (Tauri's externalBin), named with the target as Tauri expects.
      - name: Build the CLI the installer carries
        shell: bash
        run: |
          cargo build --release -p ladex --target ${{ matrix.target }}
          EXTENSION=""
          [[ "${{ runner.os }}" == "Windows" ]] && EXTENSION=".exe"
          mkdir -p crates/ladex-app/binaries
          cp "target/${{ matrix.target }}/release/ladex${EXTENSION}" "crates/ladex-app/binaries/ladex-${{ matrix.target }}${EXTENSION}"

      - name: Build the installer
        working-directory: crates/ladex-app
        run: npx --yes @tauri-apps/cli@2.11 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config tauri.release.conf.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, app]
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      # Installers arrive in per-format folders (dmg/, nsis/, deb/, appimage/), the CLI archives at the top.
      - name: Collect the files to publish
        run: |
          mkdir release
          find artifacts -type f -exec mv -t release {} +
          ls -l release

      - name: Write checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release/*
          body_path: .github/release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
